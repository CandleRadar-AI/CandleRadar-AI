<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CandleRadar AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }

        h1 {
            color: #22c55e;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
        }

        .box {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        input, select, button {
            padding: 12px;
            margin: 6px 0;
            border-radius: 7px;
            border: none;
            width: 100%;
        }

        button {
            background: #16a34a;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            background: #64748b;
        }

        .pair {
            display: block;
            padding: 10px;
            border-bottom: 1px solid #334155;
        }

        .pair input {
            width: auto;
        }

        .signal {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin: 12px 0;
            border: 1px solid #334155;
        }

        .signal h3 {
            color: #38bdf8;
        }

        .UP { color: #22c55e; }
        .DOWN { color: #ef4444; }
        .WAIT { color: #facc15; }
        .MARKET { color: #f97316; }

        .indicator {
            background: #101827;
            padding: 10px;
            border-radius: 8px;
            margin: 7px 0;
            overflow-wrap: anywhere;
        }

        .section-title {
            color: #38bdf8;
            margin-top: 18px;
        }

        .score {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .score div {
            background: #101827;
            padding: 12px;
            border-radius: 8px;
            width: 50%;
            text-align: center;
        }

        .note {
            color: #facc15;
            font-size: 13px;
            line-height: 1.6;
        }

            padding: 12px;
